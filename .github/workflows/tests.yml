name: Tests

on:
  pull_request:
  push:
    branches: [main, account, qa/testing]

jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Run PHPUnit
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan test --compact

      - name: Migration smoke (sqlite file)
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/ci-migrate.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: |
          touch database/ci-migrate.sqlite
          php artisan migrate --force --no-interaction
          php artisan config:cache
          php artisan route:cache
          php artisan schedule:list

  playwright-smoke:
    runs-on: ubuntu-latest
    needs: php-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          touch database/database.sqlite
          php artisan migrate --force --no-interaction
          php artisan e2e:seed --no-interaction

      - name: Install npm dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright portal e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
          APP_URL: http://127.0.0.1:8000
          E2E_EMAIL: e2e@truckbill.test
          E2E_PASSWORD: password
          E2E_SKIP_SEED: '0'
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
        run: npx playwright test --project=chromium
